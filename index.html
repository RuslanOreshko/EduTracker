<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Google ID Token</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <h3>Login with Google</h3>
    <div
      id="g_id_onload"
      data-client_id="376590278150-lvvfr0d3uhnv3946dl77s4hr3ejj5t6o.apps.googleusercontent.com"
      data-callback="handleCredentialResponse"
    ></div>
    <div class="g_id_signin" data-type="standard"></div>

    <pre id="out"></pre>

    <script>
      function handleCredentialResponse(response) {
        // response.credential = ID token (JWT)
        document.getElementById("out").textContent = response.credential;
      }
    </script>
  </body>
</html>
